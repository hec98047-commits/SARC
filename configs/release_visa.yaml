dataset: visa
data_root: /path/to/visa
model_path: /path/to/FGCLIP
mg_model_path: /path/to/MGFGGCLIP
output_dir: outputs/fewshot_protocol/visa
shots_list: [1, 2, 4]
seeds: [42]
methods: [ours]
modules: [A, B, C]
subset: all
low_storage: true
pgcre:
  tile_mode: 2x2
  overlap: 0.25
  lambda_weight: 0.5
  q: 0.8
  prompt_style: adaptive
  adaptive_prompt_policy_path: configs/visa_fixed_prompt_route.json
  token_modulator_checkpoint: checkpoints/{dataset}_{shot}shot_seed{seed}/ctm_epoch10_trained.pt
  enable_nrd: true
  nrd_ref_selection: fps
